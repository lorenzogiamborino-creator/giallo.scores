<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Giallo Scores</title>
  <style>
    :root {
      --bg-1: #02070d;
      --bg-2: #0b1f3d;
      --panel: rgba(13, 23, 34, 0.8);
      --panel-strong: rgba(18, 28, 40, 0.95);
      --line: rgba(255,255,255,0.09);
      --line-strong: rgba(255,255,255,0.12);
      --text: #edf5ff;
      --muted: rgba(237,245,255,0.7);
      --blue: #4ea1ff;
      --blue-strong: #1b6ef5;
      --cyan: #38d9ff;
      --green: #54e3a1;
      --gold: #f5c75d;
      --red: #ff5d6c;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(78,161,255,0.18), transparent 25%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background: rgba(3, 9, 15, 0.82);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 13, 20, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 16px 18px 12px;
    }

    .topbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-wrap { flex: 1; min-width: 0; }

    .brand {
      margin: 0;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand .blue { color: var(--blue); }

    .clock {
      margin-top: 6px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .glass-btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 14px;
      font: inherit;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .glass-btn:active { transform: scale(0.98); }

    .glass-btn.primary {
      background: linear-gradient(180deg, rgba(78,161,255,0.96), rgba(27,110,245,0.96));
      border-color: rgba(78,161,255,0.7);
      box-shadow: 0 10px 18px rgba(27,110,245,0.22);
    }

    .fav-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 12px;
      scrollbar-width: none;
    }

    .fav-row::-webkit-scrollbar { display: none; }

    .fav-chip {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
      cursor: pointer;
    }

    .fav-chip img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .feed {
      padding: 16px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin: 12px 0 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
    }

    .group-header img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }

    .group-header span {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--muted);
    }

    .match-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 12px 22px var(--shadow);
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .team-box.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team-box img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .team-name {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .score-box {
      width: 72px;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--blue);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      z-index: 30;
      padding: 18px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      width: min(100%, 440px);
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      padding: 14px 18px 18px;
      position: relative;
      overflow: hidden;
    }

    .club-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      filter: grayscale(100%) contrast(120%);
      z-index: 0;
    }

    .modal-content {
      position: relative;
      z-index: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 14px;
    }

    .modal-body {
      text-align: center;
      padding-top: 8px;
    }

    .modal-body img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .modal-body h2, .modal-body h3 {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .modal-body p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .footer {
      padding: 22px 16px 28px;
      text-align: center;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.15);
    }

    .footer p {
      margin: 0 0 12px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .insta-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--blue), #00d2ff);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 10px 18px rgba(78,161,255,0.25);
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <h1 class="brand">Giallo <span class="blue">Scores</span></h1>
          <div id="clock" class="clock">Cargando hora...</div>
        </div>
        <button id="searchBtn" class="glass-btn primary" type="button">Buscar</button>
      </div>
      <div id="favRow" class="fav-row" aria-label="Favoritos"></div>
    </header>

    <main id="feed" class="feed" aria-live="polite"></main>

    <footer class="footer">
      <p>Creado por Lorenzo Giamborino</p>
      <a
        class="insta-btn"
        href="https://www.instagram.com/lologiambo/?utm_source=ig_web_button_share_sheet"
        target="_blank"
        rel="noopener"
      >
        Contactarte
      </a>
    </footer>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div id="clubBg" class="club-bg"></div>
      <div class="modal-content">
        <div class="modal-header">
          <button id="closeModal" class="glass-btn" type="button">← Volver</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script>
    const DATA = {
      matches: [
        {
          id: 1,
          league: { name: 'Serie A', logo: 'https://media.api-sports.io/football/leagues/135.png' },
          teams: {
            home: {
              id: 489,
              name: 'AC Milan',
              logo: 'https://media.api-sports.io/football/teams/489.png',
              stadium: 'https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=900&q=80'
            },
            away: {
              id: 505,
              name: 'Inter',
              logo: 'https://media.api-sports.io/football/teams/505.png',
              stadium: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=80'
            }
          },
          goals: { home: 1, away: 1 }
        },
        {
          id: 2,
          league: { name: 'La Liga', logo: 'https://media.api-sports.io/football/leagues/140.png' },
          teams: {
            home: {
              id: 541,
              name: 'Real Madrid',
              logo: 'https://media.api-sports.io/football/teams/541.png',
              stadium: 'https://images.unsplash.com/photo-1547347298-4074fc3086f0?auto=format&fit=crop&w=900&q=80'
            },
            away: {
              id: 529,
              name: 'Barcelona',
              logo: 'https://media.api-sports.io/football/teams/529.png',
              stadium: 'https://images.unsplash.com/photo-1518604666860-9ed391f76460?auto=format&fit=crop&w=900&q=80'
            }
          },
          goals: { home: 2, away: 2 }
        }
      ]
    };

    const state = {
      favorites: [
        {
          id: 541,
          name: 'Real Madrid',
          logo: 'https://media.api-sports.io/football/teams/541.png'
        }
      ]
    };

    function updateClock() {
      const clockEl = document.getElementById('clock');
      const time = new Date().toLocaleTimeString('es-AR', {
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'America/Argentina/Buenos_Aires'
      });
      clockEl.textContent = `${time} • BUENOS AIRES`;
    }

    function renderFavorites() {
      const row = document.getElementById('favRow');
      row.innerHTML = '';

      if (!state.favorites.length) {
        const empty = document.createElement('div');
        empty.textContent = 'Sin favoritos';
        empty.style.color = 'rgba(255,255,255,0.6)';
        empty.style.fontSize = '9px';
        empty.style.fontWeight = '900';
        empty.style.letterSpacing = '1px';
        empty.style.textTransform = 'uppercase';
        empty.style.paddingTop = '8px';
        row.appendChild(empty);
        return;
      }

      state.favorites.forEach((team) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fav-chip';
        btn.title = team.name;
        btn.innerHTML = `<img src="${team.logo}" alt="${team.name}" />`;
        btn.addEventListener('click', () => openClubModal(team));
        row.appendChild(btn);
      });
    }

    function buildMatchCard(match) {
      const card = document.createElement('article');
      card.className = 'match-card';

      const home = match.teams.home;
      const away = match.teams.away;

      const row = document.createElement('div');
      row.className = 'match-row';

      const homeBox = document.createElement('div');
      homeBox.className = 'team-box';
      homeBox.innerHTML = `
        <img src="${home.logo}" alt="${home.name}" />
        <span class="team-name">${home.name}</span>
      `;
      homeBox.addEventListener('click', () => openClubModal(home));

      const score = document.createElement('div');
      score.className = 'score-box';
      score.textContent = `${match.goals.home} - ${match.goals.away}`;

      const awayBox = document.createElement('div');
      awayBox.className = 'team-box away';
      awayBox.innerHTML = `
        <span class="team-name">${away.name}</span>
        <img src="${away.logo}" alt="${away.name}" />
      `;
      awayBox.addEventListener('click', () => openClubModal(away));

      row.appendChild(homeBox);
      row.appendChild(score);
      row.appendChild(awayBox);
      card.appendChild(row);
      return card;
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      DATA.matches.forEach((match) => {
        const leagueHeader = document.createElement('div');
        leagueHeader.className = 'group-header';
        leagueHeader.innerHTML = `
          <img src="${match.league.logo}" alt="${match.league.name}" />
          <span>${match.league.name}</span>
        `;
        leagueHeader.addEventListener('click', () => openLeagueModal(match.league.name));

        const card = buildMatchCard(match);
        feed.appendChild(leagueHeader);
        feed.appendChild(card);
      });
    }

    function openClubModal(team) {
      const modal = document.getElementById('modal');
      const bg = document.getElementById('clubBg');
      const body = document.getElementById('modalBody');

      bg.style.backgroundImage = `url('${team.stadium || ''}')`;
      body.innerHTML = `
        <img src="${team.logo}" alt="${team.name}" />
        <h2>${team.name}</h2>
        <p>Información general del club</p>
      `;

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function openLeagueModal(leagueName) {
      const modal = document.getElementById('modal');
      const bg = document.getElementById('clubBg');
      const body = document.getElementById('modalBody');

      bg.style.backgroundImage = 'none';
      body.innerHTML = `
        <h3>${leagueName}</h3>
        <p>Tabla de posiciones, partidos y datos en tiempo real.</p>
      `;

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) {
        closeModal();
      }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      alert('Buscar equipo próximamente');
    });

    renderFavorites();
    renderFeed();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
