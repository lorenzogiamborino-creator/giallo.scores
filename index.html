<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Giallo Scores</title>
  <style>
    :root {
      --bg-1: #02070d;
      --bg-2: #0c1d33;
      --bg-3: #102b4d;
      --panel: rgba(16, 24, 35, 0.86);
      --panel-strong: rgba(20, 29, 41, 0.96);
      --panel-soft: rgba(255, 255, 255, 0.03);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.12);
      --text: #edf5ff;
      --muted: rgba(237,245,255,0.7);
      --blue: #4ea1ff;
      --blue-strong: #1b6ef5;
      --cyan: #38d9ff;
      --green: #54e3a1;
      --gold: #f5c75d;
      --red: #ff5d6c;
      --pink: #ff7bbf;
      --shadow: rgba(0,0,0,0.35);
      --success: #35d399;
      --warning: #ffc857;
      --danger: #ff5a6c;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(78,161,255,0.2), transparent 30%),
        radial-gradient(circle at bottom right, rgba(56,217,255,0.12), transparent 35%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 40%, var(--bg-3));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    button, input {
      font: inherit;
    }

    #app {
      width: min(100%, 520px);
      min-height: 100vh;
      background: rgba(3, 9, 15, 0.82);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 13, 20, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 16px 18px 12px;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-wrap { flex: 1; min-width: 0; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1.4px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .brand {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand .blue { color: var(--blue); }

    .clock {
      margin-top: 6px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .action-stack {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .glass-btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 14px;
      font: inherit;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .glass-btn:active { transform: scale(0.98); }

    .glass-btn.primary {
      background: linear-gradient(180deg, rgba(78,161,255,0.96), rgba(27,110,245,0.96));
      border-color: rgba(78,161,255,0.7);
      box-shadow: 0 10px 18px rgba(27,110,245,0.22);
    }

    .fav-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .fav-row::-webkit-scrollbar { display: none; }

    .fav-chip {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 5px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .fav-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(78,161,255,0.5);
    }

    .fav-chip img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .filters {
      position: sticky;
      top: 98px;
      z-index: 25;
      display: flex;
      gap: 8px;
      padding: 12px 16px 8px;
      overflow-x: auto;
      background: rgba(2,7,13,0.55);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      color: var(--text);
      background: linear-gradient(180deg, rgba(78,161,255,0.18), rgba(27,110,245,0.15));
      border-color: rgba(78,161,255,0.4);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
      padding: 16px;
    }

    .summary-card {
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 10px;
      min-height: 80px;
    }

    .summary-card .label {
      font-size: 9px;
      color: var(--muted);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .summary-card .value {
      margin-top: 10px;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .summary-card .value.blue { color: var(--blue); }
    .summary-card .value.green { color: var(--green); }
    .summary-card .value.gold { color: var(--gold); }

    .feed {
      padding: 0 16px 18px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin: 12px 0 10px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      user-select: none;
    }

    .group-header img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }

    .group-header span {
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      color: var(--muted);
    }

    .match-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 12px 22px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--danger);
    }

    .live-dot::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 6px rgba(255, 93, 108, 0.14);
      display: inline-block;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
      user-select: none;
    }

    .team-box.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team-box img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .team-name {
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .score-box {
      width: 76px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      color: var(--blue);
      line-height: 1;
    }

    .mini-stats {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      z-index: 40;
      padding: 18px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      width: min(100%, 440px);
      background: var(--panel-strong);
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      padding: 14px 18px 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 22px 44px rgba(0,0,0,0.3);
    }

    .club-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      filter: grayscale(100%) contrast(120%);
      z-index: 0;
    }

    .modal-content {
      position: relative;
      z-index: 1;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 14px;
    }

    .modal-body {
      text-align: center;
      padding-top: 8px;
    }

    .modal-body img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .modal-body h2, .modal-body h3 {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .modal-body p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .tag-list {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .tag {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    .footer {
      padding: 22px 16px 28px;
      text-align: center;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.15);
    }

    .footer p {
      margin: 0 0 12px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .insta-btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--blue), #00d2ff);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 10px 18px rgba(78,161,255,0.25);
    }

    @media (max-width: 420px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .team-name {
        max-width: 92px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <p class="eyebrow">Fútbol en vivo</p>
          <h1 class="brand">Giallo <span class="blue">Scores</span></h1>
          <div id="clock" class="clock">Cargando hora...</div>
        </div>
        <div class="action-stack">
          <button id="refreshBtn" class="glass-btn" type="button">Actualizar</button>
          <button id="searchBtn" class="glass-btn primary" type="button">Buscar</button>
        </div>
      </div>
      <div id="favRow" class="fav-row" aria-label="Favoritos"></div>
    </header>

    <nav id="filters" class="filters" aria-label="Filtros"></nav>

    <section class="summary" aria-label="Resumen">
      <div class="summary-card">
        <div class="label">Partidos</div>
        <div id="statMatches" class="value blue">0</div>
      </div>
      <div class="summary-card">
        <div class="label">En vivo</div>
        <div id="statLive" class="value green">0</div>
      </div>
      <div class="summary-card">
        <div class="label">Favoritos</div>
        <div id="statFav" class="value gold">0</div>
      </div>
    </section>

    <main id="feed" class="feed" aria-live="polite"></main>

    <footer class="footer">
      <p>Creado por Lorenzo Giamborino</p>
      <a
        class="insta-btn"
        href="https://www.instagram.com/lologiambo/?utm_source=ig_web_button_share_sheet"
        target="_blank"
        rel="noopener"
      >
        Contactarte
      </a>
    </footer>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div id="clubBg" class="club-bg"></div>
      <div class="modal-content">
        <div class="modal-header">
          <button id="closeModal" class="glass-btn" type="button">← Volver</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

    const state = {
      activeFilter: 'all',
      favorites: [
        { id: 541, name: 'Real Madrid', logo: 'https://media.api-sports.io/football/teams/541.png' },
        { id: 42, name: 'Arsenal', logo: 'https://media.api-sports.io/football/teams/42.png' }
      ]
    };

    const filterLabels = [
      { key: 'all', label: 'Todos' },
      { key: 'live', label: 'En vivo' },
      { key: 'upcoming', label: 'Próximos' },
      { key: 'favorites', label: 'Favoritos' }
    ];

    function updateClock() {
      const clockEl = document.getElementById('clock');
      const time = new Date().toLocaleTimeString('es-AR', {
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'America/Argentina/Buenos_Aires'
      });
      clockEl.textContent = `${time} • BUENOS AIRES`;
    }

    function renderFilters() {
      const filterBar = document.getElementById('filters');
      filterBar.innerHTML = '';

      filterLabels.forEach((filter) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn' + (state.activeFilter === filter.key ? ' active' : '');
        btn.textContent = filter.label;
        btn.addEventListener('click', () => {
          state.activeFilter = filter.key;
          renderFilters();
          renderFeed();
        });
        filterBar.appendChild(btn);
      });
    }

    function renderStats() {
      document.getElementById('statMatches').textContent = String(DATA.matches.length);
      document.getElementById('statLive').textContent = String(DATA.matches.filter((m) => m.status === 'live').length);
      document.getElementById('statFav').textContent = String(state.favorites.length);
    }

    function renderFavorites() {
      const row = document.getElementById('favRow');
      row.innerHTML = '';

      if (!state.favorites.length) {
        const empty = document.createElement('div');
        empty.textContent = 'Sin favoritos';
        empty.style.color = 'rgba(255,255,255,0.6)';
        empty.style.fontSize = '9px';
        empty.style.fontWeight = '900';
        empty.style.letterSpacing = '1px';
        empty.style.textTransform = 'uppercase';
        empty.style.paddingTop = '8px';
        row.appendChild(empty);
        return;
      }

      state.favorites.forEach((team) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fav-chip';
        btn.title = team.name;
        btn.innerHTML = `<img src="${team.logo}" alt="${team.name}" />`;
        btn.addEventListener('click', () => openClubModal(team));
        row.appendChild(btn);
      });
    }

    function buildMatchCard(match) {
      const card = document.createElement('article');
      card.className = 'match-card';

      const home = match.teams.home;
      const away = match.teams.away;

      const meta = document.createElement('div');
      meta.className = 'match-meta';
      meta.innerHTML = `
        <span>${match.league.name}</span>
        <span class="${match.status === 'live' ? 'live-dot' : ''}">${match.status === 'live' ? 'En vivo' : match.time}</span>
      `;

      const row = document.createElement('div');
      row.className = 'match-row';

      const homeBox = document.createElement('div');
      homeBox.className = 'team-box';
      homeBox.innerHTML = `
        <img src="${home.logo}" alt="${home.name}" />
        <span class="team-name">${home.name}</span>
      `;
      homeBox.addEventListener('click', () => openClubModal(home));

      const score = document.createElement('div');
      score.className = 'score-box';
      score.textContent = `${match.goals.home} - ${match.goals.away}`;

      const awayBox = document.createElement('div');
      awayBox.className = 'team-box away';
      awayBox.innerHTML = `
        <span class="team-name">${away.name}</span>
        <img src="${away.logo}" alt="${away.name}" />
      `;
      awayBox.addEventListener('click', () => openClubModal(away));

      const miniStats = document.createElement('div');
      miniStats.className = 'mini-stats';
      miniStats.innerHTML = `
        <span>Posesión ${match.possession.home}%</span>
        <span>TIROS ${match.shots.home}</span>
        <span>${match.event}</span>
      `;

      row.appendChild(homeBox);
      row.appendChild(score);
      row.appendChild(awayBox);
      card.appendChild(meta);
      card.appendChild(row);
      card.appendChild(miniStats);
      return card;
    }

    function getFilteredMatches() {
      const list = [...DATA.matches];

      if (state.activeFilter === 'live') {
        return list.filter((match) => match.status === 'live');
      }
      if (state.activeFilter === 'upcoming') {
        return list.filter((match) => match.status === 'upcoming');
      }
      if (state.activeFilter === 'favorites') {
        const favoriteIds = new Set(state.favorites.map((team) => team.id));
        return list.filter((match) => favoriteIds.has(match.teams.home.id) || favoriteIds.has(match.teams.away.id));
      }
      return list;
    }

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      const matches = getFilteredMatches();

      if (!matches.length) {
        const empty = document.createElement('div');
        empty.className = 'match-card';
        empty.style.textAlign = 'center';
        empty.style.color = 'var(--muted)';
        empty.style.padding = '20px';
        empty.textContent = 'No hay partidos para este filtro.';
        feed.appendChild(empty);
        return;
      }

      const grouped = matches.reduce((acc, match) => {
        const key = match.league.name;
        if (!acc[key]) acc[key] = [];
        acc[key].push(match);
        return acc;
      }, {});

      Object.entries(grouped).forEach(([leagueName, leagueMatches]) => {
        const league = leagueMatches[0].league;
        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `
          <img src="${league.logo}" alt="${leagueName}" />
          <span>${leagueName}</span>
        `;
        header.addEventListener('click', () => openLeagueModal(leagueName));
        feed.appendChild(header);

        leagueMatches.forEach((match) => {
          feed.appendChild(buildMatchCard(match));
        });
      });
    }

    function openClubModal(team) {
      const modal = document.getElementById('modal');
      const bg = document.getElementById('clubBg');
      const body = document.getElementById('modalBody');

      bg.style.backgroundImage = `url('${team.stadium || ''}')`;

      const isFavorite = state.favorites.some((favorite) => favorite.id === team.id);
      const favoriteLabel = isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos';

      body.innerHTML = `
        <img src="${team.logo}" alt="${team.name}" />
        <h2>${team.name}</h2>
        <p>${team.city || 'Club profesional'} • Valoración ${team.rating || '8.5'} / 10</p>
        <div class="tag-list">
          <span class="tag">Forma: ${team.form || 'N/A'}</span>
          <span class="tag">Estadio: ${team.city || 'Nacional'}</span>
          <span class="tag" data-role="favorite-toggle">${favoriteLabel}</span>
        </div>
      `;

      const favoriteToggle = body.querySelector('[data-role="favorite-toggle"]');
      favoriteToggle.addEventListener('click', () => {
        if (isFavorite) {
          state.favorites = state.favorites.filter((favorite) => favorite.id !== team.id);
        } else {
          state.favorites.push({
            id: team.id,
            name: team.name,
            logo: team.logo
          });
        }

        renderFavorites();
        renderStats();
        renderFeed();
        openClubModal(team);
      });

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function openLeagueModal(leagueName) {
      const modal = document.getElementById('modal');
      const bg = document.getElementById('clubBg');
      const body = document.getElementById('modalBody');

      bg.style.backgroundImage = 'none';
      const leagueMatches = DATA.matches.filter((match) => match.league.name === leagueName);
      const summary = leagueMatches.map((match) => `${match.teams.home.name} ${match.goals.home} - ${match.goals.away} ${match.teams.away.name}`).join('<br>');

      body.innerHTML = `
        <h3>${leagueName}</h3>
        <p>Tabla de posiciones, partidos y datos en tiempo real.</p>
        <div class="tag-list">
          <span class="tag">${leagueMatches.length} partidos</span>
          <span class="tag">${leagueMatches.filter((m) => m.status === 'live').length} en vivo</span>
        </div>
        <p style="margin-top: 18px; text-align: left;">${summary}</p>
      `;

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) {
        closeModal();
      }
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
      const query = prompt('Buscar club o liga', 'Real Madrid');
      if (!query) return;
      const normalized = query.trim().toLowerCase();
      const found = DATA.matches.find((match) => {
        const names = [match.teams.home.name, match.teams.away.name, match.league.name].map((value) => value.toLowerCase());
        return names.some((value) => value.includes(normalized));
      });

      if (!found) {
        alert('No encontramos coincidencias. Probá con "Real Madrid", "Arsenal" o "Serie A".');
        return;
      }

      const team = found.teams.home.name.toLowerCase().includes(normalized) ? found.teams.home : found.teams.away;
      openClubModal(team);
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      DATA.matches.forEach((match) => {
        if (match.status === 'live') {
          match.goals.home = Math.min(5, match.goals.home + (Math.random() > 0.7 ? 1 : 0));
          match.goals.away = Math.min(5, match.goals.away + (Math.random() > 0.75 ? 1 : 0));
        }
      });
      renderFeed();
      renderStats();
    });

    renderFilters();
    renderFavorites();
    renderFeed();
    renderStats();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
