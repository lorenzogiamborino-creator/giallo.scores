<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Giallo Scores</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap');

    :root {
      --bg-1: #030303;
      --bg-2: #0d1117;
      --panel: rgba(17, 17, 18, 0.7);
      --panel-strong: rgba(22, 24, 26, 0.9);
      --panel-soft: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.13);
      --text: #f7f7f7;
      --muted: rgba(255,255,255,0.62);
      --blue: #4ea1ff;
      --blue-strong: #337ef5;
      --cyan: #67e8f9;
      --gold: #facc15;
      --green: #34d399;
      --red: #ff5c5c;
      --shadow: rgba(0, 0, 0, 0.48);
      --glass: rgba(255,255,255,0.08);
      --glass-strong: rgba(255,255,255,0.15);
      --chip: rgba(255,255,255,0.035);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(78,161,255,0.12), transparent 30%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: 'Archivo', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: rgba(4,5,6,0.9);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(5,6,7,0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      padding: max(18px, env(safe-area-inset-top)) 16px 14px;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-block { min-width: 0; flex: 1; }
    .brand {
      margin: 0;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -1.5px;
      font-size: clamp(22px, 4vw, 28px);
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .brand .blue { color: var(--blue); }

    .clock {
      margin-top: 6px;
      font-size: 8px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }

    .glass-button {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      font: inherit;
      font-weight: 900;
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease, background .18s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .glass-button:active { transform: scale(0.98); }
    .glass-button.primary {
      background: linear-gradient(180deg, rgba(78,161,255,0.9), rgba(51,126,245,0.9));
      border-color: rgba(78,161,255,0.7);
      color: white;
      box-shadow: 0 12px 22px rgba(78,161,255,0.2);
    }

    .fav-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0 0;
      min-height: 46px;
      scrollbar-width: none;
    }

    .fav-row::-webkit-scrollbar { display: none; }

    .fav-chip {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line-strong);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 5px;
      position: relative;
    }

    .fav-chip img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .fav-empty {
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-top: 5px;
    }

    .search-panel {
      display: none;
      border-bottom: 1px solid var(--line);
      background: rgba(6,7,8,0.3);
      padding: 0 16px 16px;
    }

    .search-panel input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 14px 14px;
      font: inherit;
      font-size: 12px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .search-panel input::placeholder { color: rgba(255,255,255,0.45); }

    .search-results {
      margin-top: 12px;
      max-height: 260px;
      overflow-y: auto;
    }

    .search-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .team-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .team-meta img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      display: block;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .team-name {
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    .mini-add-btn {
      border: 1px solid rgba(78,161,255,0.35);
      background: rgba(78,161,255,0.08);
      color: var(--blue);
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 16px 14px;
      background: rgba(5,5,6,0.45);
      border-bottom: 1px solid var(--line);
    }

    .nav-btn {
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 8px;
      font: inherit;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all .18s ease;
    }

    .nav-btn.active {
      background: linear-gradient(180deg, rgba(78,161,255,0.95), rgba(49,126,245,0.95));
      color: white;
      border-color: rgba(78,161,255,0.7);
      box-shadow: 0 8px 18px rgba(78,161,255,0.22);
    }

    .stats-strip {
      padding: 14px 16px 0;
    }

    .stats-inner {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .kpi {
      border-radius: 18px;
      padding: 12px 8px 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .kpi-label {
      display: block;
      color: rgba(255,255,255,0.52);
      font-size: 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .kpi-value {
      display: block;
      font-size: clamp(14px, 4.4vw, 17px);
      font-weight: 900;
      line-height: 1;
    }

    .kpi-live { color: var(--red); }
    .kpi-final { color: var(--gold); }
    .kpi-favs { color: var(--blue); }

    .feed {
      padding: 14px 0 28px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      margin-top: 6px;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 118px;
      z-index: 10;
      backdrop-filter: blur(10px);
    }

    .group-header img {
      width: 15px;
      height: 15px;
      object-fit: contain;
    }

    .group-header span {
      font-size: 9px;
      color: rgba(255,255,255,0.52);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .match-card {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      background: rgba(255,255,255,0.01);
      transition: background .18s ease, transform .18s ease;
    }

    .match-card:active { transform: scale(0.995); }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .team-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .team-box.away {
      justify-content: flex-end;
      text-align: right;
    }

    .team-box img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    .team-name-box {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    .score-box {
      width: 74px;
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
    }

    .score-box.live { color: var(--red); }

    .status-chip {
      display: inline-block;
      min-width: 46px;
      text-align: center;
      border-radius: 8px;
      padding: 4px 6px;
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .status-live {
      background: rgba(255,92,92,0.18);
      color: var(--red);
      border: 1px solid rgba(255,92,92,0.4);
      animation: pulse 1.6s infinite ease-in-out;
    }

    .status-final {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .status-next {
      background: rgba(78,161,255,0.09);
      color: var(--blue);
      border: 1px solid rgba(78,161,255,0.25);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
      color: rgba(255,255,255,0.5);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 900;
    }

    .empty-state {
      text-align: center;
      padding: 80px 24px 40px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 10px;
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      z-index: 100;
      padding: 18px 16px;
      overflow-y: auto;
    }

    .modal.open { display: block; }

    .modal-shell {
      max-width: 460px;
      margin: 0 auto;
    }

    .back-btn {
      margin-bottom: 18px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border-radius: 14px;
      border: 1px solid var(--line);
      padding: 10px 16px;
      font: inherit;
      font-weight: 900;
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .modal-card {
      background: linear-gradient(180deg, rgba(13,15,17,0.94), rgba(7,8,9,0.94));
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      padding: 18px 16px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .league-title {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.58);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 900;
      text-align: center;
    }

    .score-grid {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team-panel {
      width: 35%;
      text-align: center;
    }

    .team-panel img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .team-panel-name {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.3;
    }

    .result-panel {
      width: 30%;
      text-align: center;
    }

    .big-score {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      font-weight: 900;
    }

    .status-line {
      margin-top: 10px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--red);
      font-weight: 900;
    }

    .modal-meta {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .mini-box {
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }

    .mini-box .label {
      display: block;
      margin-bottom: 6px;
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .mini-box .value {
      font-size: 11px;
      font-weight: 900;
      line-height: 1.3;
    }

    .stats-box {
      margin-top: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 12px;
    }

    .stats-box h4 {
      margin: 0 0 12px;
      text-align: center;
      color: rgba(255,255,255,0.52);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 900;
    }

    .bar {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
      margin-bottom: 2px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #82c9ff);
      border-radius: inherit;
    }

    .event-list {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .event-col h5 {
      margin: 0 0 10px;
      font-size: 9px;
      color: rgba(255,255,255,0.62);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 10px;
      line-height: 1.35;
    }

    .event-time {
      min-width: 22px;
      color: var(--blue);
      font-weight: 900;
    }

    .event-text strong { display: block; font-size: 10px; }
    .event-text small {
      display: block;
      color: rgba(255,255,255,0.42);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    @media (max-width: 420px) {
      .topbar { padding-left: 14px; padding-right: 14px; }
      .toolbar, .stats-strip { padding-left: 14px; padding-right: 14px; }
      .match-card, .group-header { padding-left: 14px; padding-right: 14px; }
      .team-name-box { max-width: 78px; }
      .score-box { width: 60px; }
      .event-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-block">
          <h2 class="brand">Giallo <span class="blue">Scores</span></h2>
          <div id="clock" class="clock">Cargando...</div>
        </div>

        <button id="favoritesBtn" class="glass-button primary" type="button">Favoritos</button>
        <button id="searchToggleBtn" class="glass-button" type="button">Buscar</button>
      </div>

      <div id="favRow" class="fav-row"></div>
    </header>

    <section id="searchPanel" class="search-panel">
      <input id="searchInput" type="text" placeholder="Buscar equipo..." />
      <div id="searchResults" class="search-results"></div>
    </section>

    <div class="toolbar">
      <button class="nav-btn" data-offset="-1" type="button">Ayer</button>
      <button class="nav-btn active" data-offset="0" type="button">Hoy</button>
      <button class="nav-btn" data-offset="1" type="button">Mañana</button>
    </div>

    <section class="stats-strip">
      <div class="stats-inner">
        <div class="kpi">
          <span class="kpi-label">En vivo</span>
          <span id="liveCount" class="kpi-value kpi-live">0</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Finales</span>
          <span id="finalCount" class="kpi-value kpi-final">0</span>
        </div>
        <div class="kpi">
          <span class="kpi-label">Favoritos</span>
          <span id="favCount" class="kpi-value kpi-favs">0</span>
        </div>
      </div>
    </section>

    <main id="feed" class="feed"></main>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-shell">
      <button class="back-btn" id="closeModalBtn" type="button">← Volver</button>
      <div id="modalBody" class="modal-card"></div>
    </div>
  </div>

  <script>
    const API_CONFIG = {
      baseUrl: '/api',
      useMockFallback: true,
      timeoutMs: 5000
    };

    const MOCK_RESPONSE = {
      matches: [
        {
          id: 101,
          league: { name: 'Liga Argentina', logo: 'https://media.api-sports.io/football/leagues/128.png' },
          fixture: { date: new Date().toISOString(), status: { short: 'LIVE', elapsed: 67 } },
          teams: {
            home: { id: 1, name: 'River Plate', logo: 'https://media.api-sports.io/football/teams/131.png' },
            away: { id: 2, name: 'Boca Juniors', logo: 'https://media.api-sports.io/football/teams/134.png' }
          },
          goals: { home: 2, away: 1 },
          score: { home: 2, away: 1 }
        },
        {
          id: 102,
          league: { name: 'Premier League', logo: 'https://media.api-sports.io/football/leagues/39.png' },
          fixture: { date: new Date(Date.now() + 3600000).toISOString(), status: { short: 'NS' } },
          teams: {
            home: { id: 3, name: 'Arsenal', logo: 'https://media.api-sports.io/football/teams/42.png' },
            away: { id: 4, name: 'Chelsea', logo: 'https://media.api-sports.io/football/teams/49.png' }
          },
          goals: { home: 0, away: 0 },
          score: { home: 0, away: 0 }
        },
        {
          id: 103,
          league: { name: 'La Liga', logo: 'https://media.api-sports.io/football/leagues/140.png' },
          fixture: { date: new Date(Date.now() - 7200000).toISOString(), status: { short: 'FT' } },
          teams: {
            home: { id: 5, name: 'Real Madrid', logo: 'https://media.api-sports.io/football/teams/541.png' },
            away: { id: 6, name: 'Barcelona', logo: 'https://media.api-sports.io/football/teams/529.png' }
          },
          goals: { home: 3, away: 2 },
          score: { home: 3, away: 2 }
        }
      ],
      standings: [
        { name: 'River Plate', points: 24, played: 9, difference: 12 },
        { name: 'Boca Juniors', points: 21, played: 9, difference: 8 },
        { name: 'Independiente', points: 18, played: 9, difference: 3 }
      ],
      players: [
        { name: 'Lionel Messi', team: 'Inter Miami', goals: 18 },
        { name: 'Kylian Mbappé', team: 'Real Madrid', goals: 16 },
        { name: 'Erling Haaland', team: 'Man City', goals: 14 }
      ],
      favorites: [
        { id: 1, name: 'River Plate', logo: 'https://media.api-sports.io/football/teams/131.png' },
        { id: 5, name: 'Real Madrid', logo: 'https://media.api-sports.io/football/teams/541.png' }
      ]
    };

    const state = {
      offset: 0,
      favorites: loadFavorites(),
      favoritesOnly: false,
      searchTimer: null
    };

    const api = {
      async request(endpoint, options = {}) {
        const url = `${API_CONFIG.baseUrl}${endpoint}`;

        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), API_CONFIG.timeoutMs);

          const res = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            ...options
          });

          clearTimeout(timer);

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          return await res.json();
        } catch (error) {
          if (API_CONFIG.useMockFallback) {
            const key = endpoint.replace(/^\//, '');
            const data = MOCK_RESPONSE[key] || MOCK_RESPONSE.matches;
            return Array.isArray(data) ? data : { data };
          }
          console.error('API request failed:', endpoint, error);
          return { error: true };
        }
      },

      getMatches() { return this.request('/matches'); },
      getStandings() { return this.request('/standings'); },
      getPlayers() { return this.request('/players'); },
      getFavorites() { return this.request('/favorites'); },
      getFixture(id) { return this.request(`/fixtures/${id}`); },
      getTeams(query) { return this.request(`/teams?search=${encodeURIComponent(query)}`); }
    };

    function loadFavorites() {
      try {
        const stored = JSON.parse(localStorage.getItem('gialloFavourites') || '[]');
        return Array.isArray(stored) ? stored : [];
      } catch {
        return [];
      }
    }

    function saveFavorites() {
      localStorage.setItem('gialloFavourites', JSON.stringify(state.favorites));
    }

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatClock() {
      return new Date().toLocaleTimeString('es-AR', {
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'America/Argentina/Buenos_Aires'
      }) + ' • BUENOS AIRES';
    }

    function updateClock() {
      document.getElementById('clock').textContent = formatClock();
    }

    function renderFavoritesBar() {
      const row = document.getElementById('favRow');
      row.innerHTML = '';

      if (!state.favorites.length) {
        row.innerHTML = '<div class="fav-empty">Sin favoritos</div>';
        document.getElementById('favCount').textContent = '0';
        return;
      }

      state.favorites.forEach((team) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'fav-chip';
        btn.title = team.name;
        btn.innerHTML = `<img src="${team.logo}" alt="${escapeHtml(team.name)}" />`;
        btn.addEventListener('click', () => {
          state.favoritesOnly = true;
          loadMatches();
        });
        row.appendChild(btn);
      });

      document.getElementById('favCount').textContent = String(state.favorites.length);
    }

    function toggleSearch() {
      const panel = document.getElementById('searchPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function toggleFavoriteTeam(team) {
      const exists = state.favorites.findIndex((item) => Number(item.id) === Number(team.id));

      if (exists >= 0) {
        state.favorites.splice(exists, 1);
      } else {
        if (state.favorites.length >= 6) state.favorites.shift();
        state.favorites.push({
          id: Number(team.id),
          name: team.name,
          logo: team.logo
        });
      }

      saveFavorites();
      renderFavoritesBar();
      loadMatches();
    }

    function renderSearchResults(items) {
      const results = document.getElementById('searchResults');
      results.innerHTML = '';

      if (!items?.length) {
        results.innerHTML = '<div class="empty-state">Sin resultados</div>';
        return;
      }

      items.forEach((item) => {
        const team = item.team || item;
        const isFav = state.favorites.some((fav) => Number(fav.id) === Number(team.id));

        const row = document.createElement('div');
        row.className = 'search-item';
        row.innerHTML = `
          <div class="team-meta">
            <img src="${team.logo}" alt="${escapeHtml(team.name)}" />
            <span class="team-name">${escapeHtml(team.name)}</span>
          </div>
          <button class="mini-add-btn" type="button">${isFav ? 'Quitar' : 'Añadir'}</button>
        `;

        row.querySelector('.mini-add-btn').addEventListener('click', () => {
          toggleFavoriteTeam(team);
        });

        results.appendChild(row);
      });
    }

    function handleSearchInput() {
      const value = document.getElementById('searchInput').value.trim();
      clearTimeout(state.searchTimer);

      if (!value || value.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
      }

      state.searchTimer = setTimeout(async () => {
        const data = await api.getTeams(value);
        const teams = Array.isArray(data) ? data : data.response || [];
        renderSearchResults(teams);
      }, 250);
    }

    function getStatus(match) {
      const status = match.fixture?.status?.short || 'NS';
      const isLive = ['1H', '2H', 'HT', 'ET', 'BT', 'P', 'LIVE'].includes(status);
      const isFT = ['FT', 'AET', 'PEN', 'CANC', 'ABD', 'AWD'].includes(status);

      if (isLive) {
        return { label: `${match.fixture.status.elapsed || ''}'`, className: 'status-live' };
      }

      if (isFT) {
        return { label: 'Fin', className: 'status-final' };
      }

      const date = new Date(match.fixture?.date || Date.now());
      return {
        label: date.toLocaleTimeString('es-AR', {
          hour: '2-digit',
          minute: '2-digit',
          timeZone: 'America/Argentina/Buenos_Aires'
        }),
        className: 'status-next'
      };
    }

    function renderMatches(matches) {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      if (!matches.length) {
        feed.innerHTML = '<div class="empty-state">Sin partidos para este día</div>';
        return;
      }

      const groups = {};
      matches.forEach((match) => {
        const leagueName = match.league?.name || 'Competición';
        if (!groups[leagueName]) groups[leagueName] = [];
        groups[leagueName].push(match);
      });

      Object.entries(groups).forEach(([leagueName, leagueMatches]) => {
        const section = document.createElement('section');

        const title = document.createElement('div');
        title.className = 'group-header';
        title.innerHTML = `
          <img src="${leagueMatches[0]?.league?.logo || ''}" alt="${escapeHtml(leagueName)}" />
          <span>${escapeHtml(leagueName)}</span>
        `;
        section.appendChild(title);

        leagueMatches.forEach((match) => {
          const card = document.createElement('article');
          card.className = 'match-card';

          const home = match.teams?.home || {};
          const away = match.teams?.away || {};
          const homeScore = match.goals?.home ?? 0;
          const awayScore = match.goals?.away ?? 0;
          const status = getStatus(match);

          card.innerHTML = `
            <div class="match-row">
              <div class="team-box">
                <img src="${home.logo || ''}" alt="${escapeHtml(home.name || '')}" />
                <span class="team-name-box">${escapeHtml(home.name || '')}</span>
              </div>

              <div class="score-box ${status.className === 'status-live' ? 'live' : ''}">${homeScore} - ${awayScore}</div>

              <div class="team-box away">
                <span class="team-name-box">${escapeHtml(away.name || '')}</span>
                <img src="${away.logo || ''}" alt="${escapeHtml(away.name || '')}" />
              </div>
            </div>

            <div class="meta-row">
              <span>${escapeHtml(match.fixture?.venue || 'Estadio')}</span>
              <span class="status-chip ${status.className}">${status.label}</span>
            </div>
          `;

          card.addEventListener('click', () => openMatchDetails(match));
          section.appendChild(card);
        });

        feed.appendChild(section);
      });

      document.getElementById('liveCount').textContent = String(matches.filter((m) => ['1H','2H','HT','ET','BT','P','LIVE'].includes(m.fixture?.status?.short || '')).length);
      document.getElementById('finalCount').textContent = String(matches.filter((m) => ['FT','AET','PEN','CANC','ABD','AWD'].includes(m.fixture?.status?.short || '')).length);
    }

    function renderStandings(rows) {
      const feed = document.getElementById('feed');
      const standings = document.createElement('section');
      standings.className = 'match-card';
      standings.innerHTML = `
        <div style="font-size:11px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.7); margin-bottom:12px;">Tabla</div>
        ${(rows || []).map((team, index) => `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid rgba(255,255,255,0.04);">
            <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">
              <span style="width:18px; font-size:10px; color:rgba(255,255,255,0.5); font-weight:900;">${index + 1}</span>
              <span style="font-size:11px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(team.name)}</span>
            </div>
            <span style="font-size:10px; color:var(--gold); font-weight:900;">${team.points ?? 0} pts</span>
          </div>
        `).join('')}
      `;
      feed.appendChild(standings);
    }

    function renderPlayers(rows) {
      const feed = document.getElementById('feed');
      const players = document.createElement('section');
      players.className = 'match-card';
      players.innerHTML = `
        <div style="font-size:11px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.7); margin-bottom:12px;">Top jugadores</div>
        ${(rows || []).map((player, index) => `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid rgba(255,255,255,0.04);">
            <div style="display:flex; align-items:center; gap:8px; min-width:0; flex:1;">
              <span style="width:18px; font-size:10px; color:rgba(255,255,255,0.5); font-weight:900;">${index + 1}</span>
              <span style="font-size:11px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(player.name)}</span>
            </div>
            <span style="font-size:10px; color:var(--blue); font-weight:900;">${player.goals ?? 0}</span>
          </div>
        `).join('')}
      `;
      feed.appendChild(players);
    }

    async function loadMatches() {
      const data = await api.getMatches();
      const matches = Array.isArray(data) ? data : data.response || [];
      const filtered = state.favoritesOnly && state.favorites.length
        ? matches.filter((match) => {
            const homeId = String(match.teams?.home?.id || '');
            const awayId = String(match.teams?.away?.id || '');
            return state.favorites.some((fav) => String(fav.id) === homeId || String(fav.id) === awayId);
          })
        : matches;

      renderMatches(filtered);
    }

    async function loadDashboard() {
      updateClock();
      renderFavoritesBar();

      const [matches, standings, players] = await Promise.all([
        api.getMatches(),
        api.getStandings(),
        api.getPlayers()
      ]);

      const matchList = Array.isArray(matches) ? matches : matches.response || [];
      const standingsList = Array.isArray(standings) ? standings : standings.response || [];
      const playersList = Array.isArray(players) ? players : players.response || [];

      renderMatches(matchList);
      renderStandings(standingsList);
      renderPlayers(playersList);
    }

    function openMatchDetails(match) {
      const modal = document.getElementById('modal');
      const body = document.getElementById('modalBody');
      const home = match.teams?.home || {};
      const away = match.teams?.away || {};
      const status = getStatus(match);
      const homeScore = match.goals?.home ?? 0;
      const awayScore = match.goals?.away ?? 0;

      body.innerHTML = `
        <div class="league-title">${escapeHtml(match.league?.name || 'Partido')}</div>
        <div class="score-grid">
          <div class="team-panel">
            <img src="${home.logo || ''}" alt="${escapeHtml(home.name || '')}" />
            <div class="team-panel-name">${escapeHtml(home.name || '')}</div>
          </div>
          <div class="result-panel">
            <h3 class="big-score">${homeScore} - ${awayScore}</h3>
            <div class="status-line">${status.label}</div>
          </div>
          <div class="team-panel">
            <img src="${away.logo || ''}" alt="${escapeHtml(away.name || '')}" />
            <div class="team-panel-name">${escapeHtml(away.name || '')}</div>
          </div>
        </div>

        <div class="modal-meta">
          <div class="mini-box">
            <span class="label">Fecha</span>
            <span class="value">${new Date(match.fixture?.date || Date.now()).toLocaleDateString('es-AR')}</span>
          </div>
          <div class="mini-box">
            <span class="label">Hora</span>
            <span class="value">${new Date(match.fixture?.date || Date.now()).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Argentina/Buenos_Aires' })}</span>
          </div>
        </div>

        <div class="stats-box">
          <h4>Estadísticas</h4>
          <div class="stat-row">
            <span>Posesión</span>
            <span>52%</span>
          </div>
          <div class="bar"><div class="bar-fill" style="width:52%"></div></div>

          <div class="stat-row">
            <span>Remates</span>
            <span>7</span>
          </div>
          <div class="bar"><div class="bar-fill" style="width:70%"></div></div>
        </div>

        <div class="event-list">
          <div class="event-col">
            <h5>Home</h5>
            <div class="event-item">
              <span class="event-time">23'</span>
              <div class="event-text"><strong>Gol</strong><small>${escapeHtml(home.name || '')}</small></div>
            </div>
          </div>
          <div class="event-col">
            <h5>Away</h5>
            <div class="event-item">
              <span class="event-time">45'</span>
              <div class="event-text"><strong>Gol</strong><small>${escapeHtml(away.name || '')}</small></div>
            </div>
          </div>
        </div>
      `;

      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      document.getElementById('modal').setAttribute('aria-hidden', 'true');
    }

    document.getElementById('favoritesBtn').addEventListener('click', () => {
      state.favoritesOnly = !state.favoritesOnly;
      if (state.favoritesOnly && !state.favorites.length) {
        state.favoritesOnly = false;
      }
      loadMatches();
    });

    document.getElementById('searchToggleBtn').addEventListener('click', toggleSearch);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('searchInput').addEventListener('input', handleSearchInput);

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.offset = Number(btn.dataset.offset || 0);
        loadMatches();
      });
    });

    document.getElementById('modal').addEventListener('click', (event) => {
      if (event.target === document.getElementById('modal')) closeModal();
    });

    updateClock();
    setInterval(updateClock, 30000);
    loadDashboard();
  </script>
</body>
</html>
